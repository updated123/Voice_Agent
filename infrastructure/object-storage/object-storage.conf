# =============================================================================
# object-storage/object-storage.conf -- where recordings/transcripts actually live (PLACEHOLDER)
# =============================================================================
#
# THE GAP THIS CLOSES
#   docs/security.md requires "call transcripts and recordings... encrypted
#   at rest" -- but until this file existed, nothing in infrastructure/
#   specified where that data physically lives. Aerospike (session-manager)
#   holds live and short-term-history call state, not multi-year audio
#   archives; Kafka is an event log, not a durable file store. Neither is
#   the right tool for "store a growing archive of audio recordings and
#   full transcripts, indefinitely, for compliance/dispute/QA purposes."
#
# WHAT WOULD BE CONFIGURED HERE
#   An S3-compatible object store (AWS S3, GCS, or self-hosted MinIO for
#   an on-prem deployment), holding:
#     - Call recordings (audio), for the subset of calls actually recorded
#       (not necessarily 100% of 1B calls/day -- see retention note below)
#     - Full call transcripts, beyond the bounded transcript[] window kept
#       in session-manager's live call-state record
#     - Escalated-call review artifacts referenced by docs/monitoring.md's
#       escalated-call review loop
#
# RETENTION AND ACCESS
#   - Retention period set by regulatory requirement (varies by
#     jurisdiction -- see docs/security.md), not "keep everything forever"
#   - Encrypted at rest (server-side encryption, customer-managed keys),
#     satisfying the requirement docs/security.md already states
#   - Access scoped by least-privilege IAM roles per service, same
#     principle as every other data store in infrastructure/terraform/ --
#     compliance/QA/legal roles need read access, most services need none
#   - PII considerations apply here exactly as they do to transcripts
#     logged elsewhere (docs/security.md's PII-minimization principle)
#
# WHY THIS WASN'T CAUGHT EARLIER
#   Every other data store in this repo (Aerospike, Redis, Kafka) was
#   added because a specific service needed it for a specific operational
#   reason. Object storage doesn't belong to any one service in the same
#   way -- it's a requirement that fell out of a compliance line item in
#   docs/security.md, not out of a service's own spec, which is exactly
#   the kind of gap that's easy to miss until someone asks "wait, where do
#   recordings actually live?"
# =============================================================================
