# =============================================================================
# redis/redis.conf -- session-manager's alternative backend (PLACEHOLDER)
# =============================================================================
#
# STATUS: documented alternative, not the primary recommendation.
#   See infrastructure/aerospike/ -- after comparing both against this
#   system's actual peak load (~370,000 session ops/sec), Aerospike was
#   chosen as the primary recommendation for its 17-48% lower p99 latency
#   (independent benchmarks), which matters given every stage in
#   docs/latency-budget.md's turn-taking budget is milliseconds-accountable.
#   Redis Cluster remains a fully valid choice if ecosystem maturity and
#   operational familiarity are weighted higher than the p99 gap -- it
#   comfortably clears the required throughput either way (350-800K
#   ops/sec per shard).
#
# Would configure Redis Cluster (not single-instance -- required at ~2.2M
# concurrent call-state records, docs/scaling.md) backing session-manager:
#
#   - Cluster mode enabled, sharded by call-id hash slot
#   - Per-key TTL matching max call duration + grace period (state for a
#     completed/abandoned call should not persist indefinitely)
#   - Replication factor >=2 per shard for the failure-domain resilience
#     described in docs/architecture.md ("media server crash mid-call" ->
#     state already externalized, so campaign logic doesn't re-attempt a
#     call that actually succeeded)
#   - maxmemory-policy tuned to evict least-recently-used completed-call
#     keys before active-call keys, if under memory pressure
# =============================================================================
