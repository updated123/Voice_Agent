# =============================================================================
# aerospike/aerospike.conf -- session-manager's recommended production backend (PLACEHOLDER)
# =============================================================================
#
# WHY AEROSPIKE OVER REDIS CLUSTER FOR THIS COMPONENT
#   Both were compared against this system's actual peak load (~2.2M
#   concurrent call records, ~370,000 session read/write ops/sec at peak)
#   rather than picked by default. Redis Cluster comfortably clears that
#   throughput (350-800K ops/sec per shard), so raw capacity was never the
#   deciding factor. The deciding factor is tail latency: independent
#   benchmarks show Aerospike delivering 17-48% lower p99 latency than
#   Redis across comparable workloads, driven by Redis's single-threaded
#   event loop becoming a bottleneck under high concurrency (observed p99
#   in the 862-4,447ms range in one benchmark, vs. Aerospike staying
#   sub-millisecond). Given every stage in docs/latency-budget.md's
#   turn-taking budget is milliseconds-accountable, a session-state read
#   that occasionally tails into multi-second p99 is a real risk to the
#   500-700ms turn-latency target, not a rounding error.
#
# WHAT WOULD BE CONFIGURED HERE
#   - Namespace sized for ~2.2M concurrent call records, each small
#     (FSM state, slots, a bounded transcript window) -- an in-memory
#     namespace with async replication to disk, not the full durability
#     tier Aerospike also supports (call state doesn't need to survive
#     a full cluster outage; a lost call is acceptable, a slow one is not)
#   - Replication factor >=2 per partition, matching the same resilience
#     principle used for Redis Cluster in docs/architecture.md's
#     failure-domain table
#   - This replication is WITHIN a region's cluster only -- no cross-region
#     XDR (or equivalent) is configured here. A regional outage therefore
#     drops in-flight calls in that region rather than migrating their
#     session state elsewhere; only NEW calls fail over to another region.
#     Consistent with this file's own "a lost call is acceptable, a slow
#     one is not" principle, but it's the reason docs/architecture.md's
#     failure-domain table now states plainly that active-active here
#     means new-call continuity, not mid-call continuity. See
#     docs/future-improvements.md if cross-region XDR is ever added.
#   - TTL per record matching max call duration + grace period, same as
#     the Redis Cluster design it replaces
#   - Client-side sharding via Aerospike's native partition map, avoiding
#     the operational overhead of Redis Cluster's hash-slot resharding
#
# TRADEOFF BEING ACCEPTED
#   Redis has a larger ecosystem, more operational familiarity, and more
#   hosted-managed options (ElastiCache, Redis Cloud) than Aerospike does.
#   This is a deliberate trade of ecosystem maturity for tail-latency
#   performance on the one component where that tradeoff is worth making.
#   See infrastructure/redis/ -- kept as the documented fallback/alternative
#   if operational familiarity is weighted higher than the p99 gap.
# =============================================================================
